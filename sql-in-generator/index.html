        .btn {

        .btn-secondary:hover {

        }

        .btn-copy {
            background: #4CAF50;
            color: white;
        }

        .btn-copy:hover {
            background: #45a049;
        }

        textarea {
            width: 100%;
            height: 500px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .convert-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-convert {
            padding: 15px 50px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-convert:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .settings-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;

        }

        .settings-section h3 {

        .settings-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .settings-row label {
            color: #555;
            font-size: 14px;
            min-width: 120px;
        }

        .settings-row input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }

        .settings-row input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .settings-row select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
            background: white;
        }

        .settings-row select:focus {
            outline: none;
            border-color: #667eea;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 1200px) {
            textarea {
                height: 400px;
            }

            .example-section .example-box {
                flex-direction: column;

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SQL IN子句组合</h1>
            <p>将一列文字快速拼接成SQL IN语句格式</p>
        </div>

        <div class="content">

            <div class="main-section">
                <div class="text-panel">
                    <div class="panel-header">
                        <span class="panel-title">文字内容</span>
                        <div class="panel-actions">
                            <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                            <button class="btn btn-secondary" onclick="pasteFromClipboard()">粘贴</button>
                            <button class="btn btn-copy" onclick="copyToClipboard()">复制</button>
                        </div>
                    </div>
                    <textarea id="inputData" placeholder="请在此处粘贴文字，例如：
1
2
3
或
张三
李四
王五

点击"拼接"按钮后，结果将覆盖此处内容"></textarea>
                </div>
            </div>

            <div class="convert-section">
                <button class="btn-convert" onclick="joinText()">拼接</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">已复制到剪贴板！</div>

    <script>
        // 清空输入
        function clearInput() {
            if (confirm('确定要清空内容吗？')) {
                document.getElementById('inputData').value = '';
            }
        }

        // 从剪贴板粘贴
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputData').value = text;
                showToast('已从剪贴板粘贴！');
            } catch (err) {
                alert('无法访问剪贴板，请手动粘贴数据。');
            }
        }

        // 复制到剪贴板
        function copyToClipboard() {
            const outputText = document.getElementById('inputData').value;
            if (outputText.trim() === '') {
                alert('没有可复制的内容，请先输入或拼接文字！');
                return;
            }

            navigator.clipboard.writeText(outputText).then(function() {
                showToast('已复制到剪贴板！');
            }).catch(function(err) {
                // 如果现代API失败，使用传统方法
                const textarea = document.getElementById('inputData');
                textarea.select();
                document.execCommand('copy');
                showToast('已复制到剪贴板！');
            });
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // 拼接文字
        function joinText() {
            const inputText = document.getElementById('inputData').value;
            let quoteType = 'single';
            let separator = 'comma';
            let addBrackets = 'yes';
            let prefix = '';
            let suffix = '';
            
            // 检查元素是否存在
            const quoteTypeElement = document.getElementById('quoteType');
            if (quoteTypeElement) {
                quoteType = quoteTypeElement.value;
            }
            
            const separatorElement = document.getElementById('separator');
            if (separatorElement) {
                separator = separatorElement.value;
            }
            
            const addBracketsElement = document.getElementById('addBrackets');
            if (addBracketsElement) {
                addBrackets = addBracketsElement.value;
            }
            
            const prefixElement = document.getElementById('prefix');
            if (prefixElement) {
                prefix = prefixElement.value;
            }
            
            const suffixElement = document.getElementById('suffix');
            if (suffixElement) {
                suffix = suffixElement.value;
            }

            if (!inputText.trim()) {
                alert('请输入文字！');
                return;
            }

            // 分割行，去除空行和空白字符
            const lines = inputText.split(/\r?\n/)
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length === 0) {
                alert('没有有效的文字！');
                return;
            }

            // 确定引号
            let quote = '';
            if (quoteType === 'single') {
                quote = "'";
            } else if (quoteType === 'double') {
                quote = '"';
            }

            // 确定分隔符
            let sep = '';
            if (separator === 'comma') {
                sep = ',';
            } else if (separator === 'semicolon') {
                sep = ';';
            } else if (separator === 'space') {
                sep = ' ';
            } else if (separator === 'newline') {
                sep = '\n';
            }

            // 拼接文字
            const joinedText = lines.map(line => quote + line + quote).join(sep);

            // 添加括号
            let result = joinedText;
            if (addBrackets === 'yes') {
                result = '(' + result + ')';
            }

            // 添加前缀和后缀
            if (prefix) {
                result = prefix + result;
            }
            if (suffix) {
                result = result + suffix;
            }

            // 显示结果（覆盖输入框内容）
            document.getElementById('inputData').value = result;
            showToast('拼接完成！');
        }
    </script>
</body>
</html>
