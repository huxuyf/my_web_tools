<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转表格工具</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>文本转表格工具</h1>
            <p>将OCR识别的一列文本转换为多列表格</p>
        </div>

        <div class="content">
            <!-- 设置区域 -->
            <div class="settings-section">
                <h3>转换设置</h3>
                <div class="settings-row">
                    <label for="columnCount">目标列数：</label>
                    <input type="number" id="columnCount" min="2" max="10" value="2">
                    <span style="color: #666; font-size: 13px;">（范围：2-10列）</span>
                </div>
            </div>



            <!-- 文本输入区域 -->
            <div class="main-section">
                <div class="text-panel">
                    <div class="panel-header">
                        <div>
                            <div class="panel-title">文本内容</div>
                        </div>
                        <div class="panel-actions">
                            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
                            <button class="btn btn-copy" onclick="copyResult()">复制</button>
                        </div>
                    </div>
                    <textarea id="textInput" placeholder="请在此处粘贴OCR识别的一列文本...

示例：
苹果
香蕉
橙子
葡萄
西瓜
芒果"></textarea>
                </div>
            </div>

            <!-- 转换按钮 -->
            <div class="convert-section">
                <button class="btn-convert" onclick="convertText()"> 转换 </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" style="display: none;"></div>

    <script src="app.js"></script>
    
</body>
</html>
