<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化工具</title>
    <!-- Tailwind CSS -->
    <script src="./js/tailwind.min.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="./js/xlsx.full.min.js"></script>
    <!-- Apache ECharts -->
    <script src="./js/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .upload-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .upload-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .upload-zone:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }
        .error-message {
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .chart-container {
            min-height: 400px;
        }
        select, button {
            transition: all 0.2s ease;
        }
        select:hover, button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 标题区域 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">数据可视化工具</h1>
            <p class="text-gray-600">上传 Excel 或 CSV 文件，轻松创建交互式图表</p>
        </header>

        <!-- 错误提示区域 -->
        <div id="errorContainer" class="hidden mb-4">
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg error-message">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700" id="errorText"></p>
                    </div>
                    <div class="ml-auto pl-3">
                        <button onclick="hideError()" class="text-red-400 hover:text-red-600">
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 文件上传区域 -->
        <div class="mb-8">
            <div id="uploadZone" class="upload-zone rounded-xl p-12 text-center bg-white shadow-sm cursor-pointer">
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
                <div id="uploadContent">
                    <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p class="text-lg text-gray-600 mb-2">拖拽文件到此处或点击选择文件</p>
                    <p class="text-sm text-gray-400">支持 .xlsx, .xls, .csv 格式</p>
                </div>
                <div id="fileInfo" class="hidden">
                    <svg class="mx-auto h-16 w-16 text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="text-lg text-gray-700 mb-1" id="fileName"></p>
                    <p class="text-sm text-gray-500" id="fileSize"></p>
                    <button onclick="resetUpload()" class="mt-4 text-sm text-blue-600 hover:text-blue-800">重新选择文件</button>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loadingContainer" class="hidden mb-8">
            <div class="flex items-center justify-center bg-white rounded-xl p-8 shadow-sm">
                <div class="loading-spinner mr-3"></div>
                <span class="text-gray-600" id="loadingText">正在处理...</span>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div id="mainContent" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- 配置面板 -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h2 class="text-xl font-semibold text-gray-800 mb-6">图表配置</h2>
                        
                        <!-- X 轴选择 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">X 轴（类别）</label>
                            <select id="xAxisSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option value="">请选择 X 轴</option>
                            </select>
                        </div>

                        <!-- Y 轴选择 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Y 轴（数值）</label>
                            <select id="yAxisSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option value="">请选择 Y 轴</option>
                            </select>
                        </div>

                        <!-- 图表类型选择 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-3">图表类型</label>
                            <div class="space-y-2">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="chartType" value="bar" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-gray-700">柱状图</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="chartType" value="line" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-gray-700">折线图</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="chartType" value="pie" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                    <span class="ml-2 text-gray-700">饼图</span>
                                </label>
                            </div>
                        </div>

                        <!-- 导出按钮 -->
                        <button id="exportBtn" onclick="exportChart()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 font-medium">
                            导出图片
                        </button>
                    </div>
                </div>

                <!-- 图表展示区域 -->
                <div class="lg:col-span-3">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <div id="chartContainer" class="chart-container"></div>
                    </div>
                </div>
            </div>
        </div>

        </div>
    </div>

    <script>
        // 全局变量
        let rawData = [];
        let headers = [];
        let numericColumns = [];
        let chart = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initFileUpload();
            initConfigListeners();
        });

        // 文件上传模块
        function initFileUpload() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');

            // 点击上传
            uploadZone.addEventListener('click', function(e) {
                if (e.target.tagName !== 'BUTTON') {
                    fileInput.click();
                }
            });

            // 文件选择
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    handleFileSelect(file);
                }
            });

            // 拖拽事件
            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.add('dragover');
            });

            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
            });

            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            });
        }

        // 处理文件选择
        function handleFileSelect(file) {
            // 验证文件格式
            const validExtensions = ['.xlsx', '.xls', '.csv'];
            const fileName = file.name.toLowerCase();
            const isValid = validExtensions.some(ext => fileName.endsWith(ext));

            if (!isValid) {
                showError('不支持的文件格式。请选择 .xlsx, .xls 或 .csv 文件。');
                return;
            }

            // 显示文件信息
            document.getElementById('uploadContent').classList.add('hidden');
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);

            // 解析文件
            parseFile(file);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 重置上传
        function resetUpload() {
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadContent').classList.remove('hidden');
            document.getElementById('fileInfo').classList.add('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            if (chart) {
                chart.dispose();
                chart = null;
            }
            rawData = [];
            headers = [];
            numericColumns = [];
            hideError();
        }

        // 文件解析模块
        function parseFile(file) {
            showLoading('正在解析文件...');

            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 获取第一个工作表
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    // 转换为 JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonData.length === 0) {
                        throw new Error('文件为空或没有数据');
                    }

                    // 提取表头和数据
                    headers = jsonData[0];
                    rawData = jsonData.slice(1).filter(row => row.length > 0);

                    if (rawData.length === 0) {
                        throw new Error('文件中没有有效数据');
                    }

                    // 识别数值类型列
                    identifyNumericColumns();

                    // 更新配置面板
                    updateConfigPanel();

                    // 显示主内容区域
                    document.getElementById('mainContent').classList.remove('hidden');

                    // 初始化图表
                    initChart();

                    hideLoading();

                } catch (error) {
                    hideLoading();
                    showError('文件解析失败: ' + error.message);
                    console.error('Parse error:', error);
                }
            };

            reader.onerror = function() {
                hideLoading();
                showError('文件读取失败，请重试');
            };

            reader.readAsArrayBuffer(file);
        }

        // 识别数值类型列
        function identifyNumericColumns() {
            numericColumns = [];

            for (let i = 0; i < headers.length; i++) {
                const header = headers[i];
                let isNumeric = true;
                let hasData = false;

                for (let j = 0; j < rawData.length; j++) {
                    const value = rawData[j][i];
                    if (value !== undefined && value !== null && value !== '') {
                        hasData = true;
                        if (isNaN(parseFloat(value))) {
                            isNumeric = false;
                            break;
                        }
                    }
                }

                if (isNumeric && hasData) {
                    numericColumns.push(header);
                }
            }
        }

        // 更新配置面板
        function updateConfigPanel() {
            // 更新 X 轴选择器
            const xAxisSelect = document.getElementById('xAxisSelect');
            xAxisSelect.innerHTML = '<option value="">请选择 X 轴</option>';
            headers.forEach(header => {
                const option = document.createElement('option');
                option.value = header;
                option.textContent = header;
                xAxisSelect.appendChild(option);
            });

            // 更新 Y 轴选择器
            const yAxisSelect = document.getElementById('yAxisSelect');
            yAxisSelect.innerHTML = '<option value="">请选择 Y 轴</option>';
            numericColumns.forEach(column => {
                const option = document.createElement('option');
                option.value = column;
                option.textContent = column;
                yAxisSelect.appendChild(option);
            });

            // 自动选择默认值
            if (headers.length > 0 && !numericColumns.includes(headers[0])) {
                xAxisSelect.value = headers[0];
            }
            if (numericColumns.length > 0) {
                yAxisSelect.value = numericColumns[0];
            }
        }

        // 初始化配置监听器
        function initConfigListeners() {
            const xAxisSelect = document.getElementById('xAxisSelect');
            const yAxisSelect = document.getElementById('yAxisSelect');
            const chartTypeRadios = document.querySelectorAll('input[name="chartType"]');

            xAxisSelect.addEventListener('change', updateChart);
            yAxisSelect.addEventListener('change', updateChart);
            chartTypeRadios.forEach(radio => {
                radio.addEventListener('change', updateChart);
            });
        }

        // 初始化图表
        function initChart() {
            const chartContainer = document.getElementById('chartContainer');
            chart = echarts.init(chartContainer);

            // 响应窗口大小变化
            window.addEventListener('resize', function() {
                if (chart) {
                    chart.resize();
                }
            });

            // 渲染初始图表
            updateChart();
        }

        // 更新图表
        function updateChart() {
            if (!chart) return;

            const xColumn = document.getElementById('xAxisSelect').value;
            const yColumn = document.getElementById('yAxisSelect').value;
            const chartType = document.querySelector('input[name="chartType"]:checked').value;

            if (!xColumn || !yColumn) {
                return;
            }

            // 准备数据
            const xIndex = headers.indexOf(xColumn);
            const yIndex = headers.indexOf(yColumn);

            const chartData = rawData.map(row => {
                const xValue = row[xIndex];
                const yValue = parseFloat(row[yIndex]) || 0;
                return { name: xValue, value: yValue };
            });

            // 配置图表选项
            const option = getChartOption(chartType, xColumn, yColumn, chartData);

            // 渲染图表
            chart.setOption(option, true);
        }

        // 获取图表配置
        function getChartOption(chartType, xColumn, yColumn, chartData) {
            const baseOption = {
                tooltip: {
                    trigger: chartType === 'pie' ? 'item' : 'axis',
                    formatter: chartType === 'pie' 
                        ? '{b}: {c} ({d}%)' 
                        : '{b}: {c}'
                },
                legend: {
                    data: chartData.map(item => item.name),
                    type: 'scroll'
                },
                toolbox: {
                    feature: {
                        dataZoom: {
                            yAxisIndex: 'none'
                        },
                        restore: {},
                        saveAsImage: {}
                    }
                }
            };

            if (chartType === 'pie') {
                return {
                    ...baseOption,
                    series: [{
                        type: 'pie',
                        radius: '60%',
                        data: chartData,
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }]
                };
            } else {
                return {
                    ...baseOption,
                    xAxis: {
                        type: 'category',
                        data: chartData.map(item => item.name),
                        axisLabel: {
                            rotate: 45,
                            interval: 0
                        }
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [{
                        type: chartType,
                        data: chartData.map(item => item.value),
                        name: yColumn,
                        smooth: chartType === 'line'
                    }]
                };
            }
        }

        // 导出图表
        function exportChart() {
            if (!chart) {
                showError('请先上传数据并生成图表');
                return;
            }

            try {
                // 获取当前配置
                const currentOption = chart.getOption();

                // 临时移除 toolbox 以避免导出时显示工具栏图标
                const optionWithoutToolbox = {
                    ...currentOption,
                    toolbox: undefined
                };

                // 应用不带 toolbox 的配置
                chart.setOption(optionWithoutToolbox);

                // 导出图片
                const url = chart.getDataURL({
                    type: 'png',
                    pixelRatio: 2,
                    backgroundColor: '#fff'
                });

                // 恢复原始配置（包含 toolbox）
                chart.setOption(currentOption);

                // 触发下载
                const link = document.createElement('a');
                link.href = url;
                link.download = 'chart_' + new Date().getTime() + '.png';
                link.click();
            } catch (error) {
                showError('导出图片失败: ' + error.message);
            }
        }

        // 显示错误
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorContainer.classList.remove('hidden');
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('errorContainer').classList.add('hidden');
        }

        // 显示加载状态
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingContainer').classList.remove('hidden');
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loadingContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
