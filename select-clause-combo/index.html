<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECT子句组合</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <h1>SELECT子句组合</h1>

        <div class="input-section">
            <div class="input-group">
                <textarea id="textA" placeholder="请输入文本A，例如：1,2,3"></textarea>
            </div>
            <div class="input-group">
                <textarea id="textB" placeholder="请输入文本B，例如：苹果 香蕉 橘子"></textarea>
            </div>
        </div>

        <div class="button-section">
            <button class="btn-process" onclick="processText()">组合处理</button>
            <button class="btn-clear" onclick="clearAll()">清空所有</button>
        </div>

        <div class="output-section">
            <textarea id="output" readonly placeholder="处理后的结果将显示在这里，点击可复制"></textarea>
        </div>
    </div>

    <div id="toast" class="toast">已复制到剪贴板！</div>

    
    <script src="app.js"></script>
</body>
</html>
