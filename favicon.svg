<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 工具箱盒子 -->
  <rect x="8" y="20" width="48" height="32" rx="4" fill="url(#grad1)" />

  <!-- 工具箱盖子 -->
  <rect x="6" y="16" width="52" height="6" rx="2" fill="#5a6fd6" />

  <!-- 工具箱把手 -->
  <rect x="24" y="12" width="16" height="6" rx="2" fill="#764ba2" />

  <!-- 工具图标 - 扳手 -->
  <g transform="translate(14, 28) rotate(-30)">
    <path d="M0 0 L8 8 L16 8 L16 4 L8 4 L0 -4 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="4" cy="-4" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 工具图标 - 齿轮 -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="url(#grad1)"/>
    <rect x="-1.5" y="-8" width="3" height="4" fill="#ffffff" opacity="0.9"/>
    <rect x="-1.5" y="4" width="3" height="4" fill="#ffffff" opacity="0.9"/>
    <rect x="-8" y="-1.5" width="4" height="3" fill="#ffffff" opacity="0.9"/>
    <rect x="4" y="-1.5" width="4" height="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 工具图标 - 铅笔 -->
  <g transform="translate(46, 28) rotate(45)">
    <rect x="-2" y="-8" width="4" height="12" fill="#ffffff" opacity="0.9"/>
    <polygon points="-2,4 2,4 0,8" fill="#ffcc00"/>
    <rect x="-2" y="-8" width="4" height="2" fill="#ffcc00"/>
  </g>

  <!-- 锁扣 -->
  <rect x="28" y="46" width="8" height="6" rx="2" fill="#764ba2" />
</svg>
