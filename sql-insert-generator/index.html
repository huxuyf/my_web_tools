<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据插入脚本生成</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>数据插入脚本生成</h1>
            <p>将Excel/CSV数据转换为Oracle SQL INSERT语句</p>
        </div>

        <div class="content">
            <!-- <div class="settings-section">
                <h3>配置选项</h3>
                <div class="settings-row">
                    <label>表名：</label>
                    <input type="text" id="tableName" value="TMP_IMP_DATA" placeholder="输入表名">
                </div>
                <div class="settings-row">
                    <label>分割行数：</label>
                    <input type="number" id="splitLineNum" value="1000" min="1" placeholder="每批插入的行数">
                </div>
            </div> -->

            <div class="main-section">
                <div class="text-panel">
                    <div class="panel-header">
                        <span class="panel-title">数据内容</span>
                        <div class="panel-actions">
                            <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                            <button class="btn btn-secondary" onclick="pasteFromClipboard()">粘贴</button>
                            <button class="btn btn-copy" onclick="copyToClipboard()">复制</button>
                        </div>
                    </div>
                    <textarea id="inputData" placeholder="请在此处粘贴数据，例如：
姓名	年龄	性别
张三	25	男
李四	30	女
王五	28	男

点击"转换"按钮后，生成的SQL语句将覆盖此处内容"></textarea>
                </div>
            </div>

            <div class="convert-section">
                <button class="btn-convert" onclick="convertToSql()">转换</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">已复制到剪贴板！</div>

    
    <script src="app.js"></script>
</body>
</html>
